name: Gitleaks
# Detect hardcoded secrets in git history and code.
# Two jobs:
# - gitleaks (incremental): gitleaks-action v3 scans the PR/push commit
#   range and comments on the PR when it finds a leak.
# - gitleaks-full-history: runs the gitleaks CLI directly over the history
#   reachable from HEAD, so a leak in an old commit is caught even when it
#   is outside the current PR/push range, and a PR with more than 30
#   commits is fully covered -- the action only reads the first page of
#   the PR commit list, this job does not use the PR commit list at all.
#   Scope is HEAD only (--log-opts with HEAD, no --all): secrets on
#   unrelated branches must not fail this PR or main. Merge commits are
#   covered twice: `-m` makes git log emit a diff per parent, so a secret
#   introduced by merge resolution shows up in the history scan, and a
#   `gitleaks dir` scan of the checked-out tree catches any secret present
#   in the current snapshot. A found leak fails the check by design and
#   needs human triage. PR comments from the incremental action are
#   disabled (GITLEAKS_ENABLE_COMMENTS=false): comment bodies can
#   contain unescaped filenames; leaks still fail the job and surface
#   via code scanning.
# AutoMerge note: output/ is generated public node data (rebuilt every
# 6h from 100+ public subscription sources; the node credentials in it
# are the product, not repo secrets), so it is allowlisted below --
# otherwise this check can never go green on this repo. The path
# pattern is ANCHORED to the repo root (gitleaks MatchString is an
# unanchored substring search, so an unanchored `output/.*` would also
# swallow src/output/credentials.env, and the `.` in `(./)?` must be
# escaped or `a/output/...` matches too): `^(\\./)?` covers the `./`
# prefix some scan modes report.
# Reports go to $RUNNER_TEMP (outside the repo) on purpose: the
# history scan's SARIF contains the secrets it found, and if it lived
# in the workspace the working-tree scan would read it back and flag
# it -- and allowlisting SARIF filenames instead would let a PR
# author hide a secret in a committable gitleaks-*.sarif file.
# The deleted generated files snippets/nodes.meta.yml, list.yml and
# list.meta.yml are NOT path-excluded: they are forgiven by COMMIT
# only (3e386b7, the 2026-05-17 bot commit "Update nodes" that
# introduced them -- verified: every one of their findings cites
# that single commit). A new secret in those paths, in any other
# commit or in the working tree, is still flagged.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  security-events: write
env:
  # Shared by all three scans in this file (CLI steps and the action
  # both follow the gitleaks config precedence, which includes
  # GITLEAKS_CONFIG_TOML). [extend] useDefault is required: a custom
  # config without it REPLACES the default rules and nothing is
  # detected at all (verified locally against gitleaks v8.30.1).
  GITLEAKS_CONFIG_TOML: |
    [extend]
    useDefault = true

    [allowlist]
    paths = ["^(\\./)?output/.*"]
    # Historical generated node data, forgiven by commit only (see note
    # above): snippets/nodes.meta.yml, list.yml, list.meta.yml, all
    # introduced by bot commits 3e386b7 and 45d6437 ("Update nodes").
    # Both SHAs were read off the scanners' own findings, not guessed:
    # every finding in those files cites one of these two commits.
    commits = ["3e386b7031ce42403f18514696fb761e8d961915", "45d6437424179442b0fa54f786cd4a277d40105c"]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # pull-requests: write is scoped to this job only: it is the one
    # that comments on the PR when a leak is found. Job-level
    # permissions replace the workflow-level set for this job, so the
    # other two permissions are repeated here.
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      # Pinned to the full commit SHA of the v7.0.1 tag
      # (3d3c42e5aac5ba805825da76410c181273ba90b1, verified via the API).
      # persist-credentials is off: this job only reads code and never
      # pushes, so the token must not linger in .git/config (same
      # rationale as semgrep.yml; CodeRabbit review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned to the full commit SHA of the v3.0.0 tag
      # (e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e, verified via the API);
      # a mutable tag could be re-pointed at malicious code.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments are disabled: comment bodies can contain
          # unescaped filenames (CodeRabbit review). A found leak still
          # fails this job, and the full-history job below uploads
          # SARIF to code scanning, so nothing is lost silently.
          GITLEAKS_ENABLE_COMMENTS: 'false'
  gitleaks-full-history:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the full commit SHA of the v7.0.1 tag
      # (3d3c42e5aac5ba805825da76410c181273ba90b1, verified via the API).
      # persist-credentials is off: this job only reads code and never
      # pushes, so the token must not linger in .git/config (same
      # rationale as semgrep.yml; CodeRabbit review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks v8.30.1
        run: |
          # SHA256 pinned in the workflow itself: the tarball and the
          # release's checksums file come from the same source, so
          # verifying against that file proves nothing if the release
          # is compromised -- and --ignore-missing cannot guarantee
          # the target entry was even checked (CodeRabbit review).
          # This is the published checksum of
          # gitleaks_8.30.1_linux_x64.tar.gz, verified 2026-11-09.
          curl -sSL --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks_8.30.1_linux_x64.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # --diff-filter letters are lowercase = EXCLUDE. uxdb excludes
      # unmerged/unknown/deleted/broken only: `t` (typechange) is
      # deliberately NOT excluded, so a symlink replaced by a
      # secret-containing regular file is still scanned (verified
      # locally: tuxdb missed it, uxdb finds it; CodeRabbit review).
      - name: Scan full git history
        run: gitleaks git . --log-opts="--full-history --diff-filter=uxdb -m HEAD" --redact --report-format sarif --report-path "${{ runner.temp }}/gitleaks-full.sarif"
      # The SARIF lives in $RUNNER_TEMP (see header note), so the
      # upload needs an explicit existence check -- hashFiles only
      # sees files inside the workspace.
      - name: Check full-history SARIF exists
        id: full-check
        if: always()
        run: |
          if [ -s "${{ runner.temp }}/gitleaks-full.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Gitleaks full-history results to code scanning
        # Upload only when the token can write: on fork / Dependabot
        # PRs GITHUB_TOKEN is read-only and the upload fails even
        # though nothing leaked (CodeRabbit review).
        if: ${{ always() && steps.full-check.outputs.exists == 'true' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        # Pinned to the full commit SHA of the v4 tag
        # (33d7b85da1a04171e211befe2c739303b9a4c066, verified via the
        # codeql-action v4 tag ref) -- same as the tree upload below.
        # A mutable tag could be re-pointed at malicious code, and
        # this step runs with security-events: write (CodeRabbit
        # review).
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-full.sarif
          category: gitleaks-full-history
      - name: Scan working tree (merge-commit snapshots)
        if: always()
        run: gitleaks dir . --redact --report-format sarif --report-path "${{ runner.temp }}/gitleaks-tree.sarif"
      - name: Check working-tree SARIF exists
        id: tree-check
        if: always()
        run: |
          if [ -s "${{ runner.temp }}/gitleaks-tree.sarif" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Gitleaks working-tree results to code scanning
        if: ${{ always() && steps.tree-check.outputs.exists == 'true' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
        # Pinned to the full commit SHA of the v4 tag
        # (33d7b85da1a04171e211befe2c739303b9a4c066, verified via the
        # codeql-action v4 tag ref); both upload-sarif steps in this
        # file are pinned -- a mutable tag could be re-pointed at
        # malicious code.
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-tree.sarif
          category: gitleaks-tree

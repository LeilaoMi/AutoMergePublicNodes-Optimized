name: Security
# Shared scans from LeilaoMi/security-workflows (pinned to a commit SHA;
# Dependabot's github-actions updates bump it). Job-level permissions
# cap what each reusable workflow may use.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/gitleaks.yml@18b9729a36d131573f71b3737ae20db8e1c4f097 # v3
  semgrep:
    permissions:
      contents: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/semgrep.yml@18b9729a36d131573f71b3737ae20db8e1c4f097 # v3
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/trivy.yml@18b9729a36d131573f71b3737ae20db8e1c4f097 # v3
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: LeilaoMi/security-workflows/.github/workflows/zizmor.yml@18b9729a36d131573f71b3737ae20db8e1c4f097 # v3
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: LeilaoMi/security-workflows/.github/workflows/dependency-review.yml@18b9729a36d131573f71b3737ae20db8e1c4f097 # v3
  lint:
    uses: LeilaoMi/security-workflows/.github/workflows/lint.yml@18b9729a36d131573f71b3737ae20db8e1c4f097 # v3
    with:
      ruff: true

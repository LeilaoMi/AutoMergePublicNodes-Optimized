name: Security
# Shared scans from LeilaoMi/security-workflows (pinned to a commit SHA;
# Dependabot's github-actions updates bump it). Job-level permissions
# cap what each reusable workflow may use.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/gitleaks.yml@a311edecaf72edbbbada28c2c3dd41a2af4145e3 # v2
  semgrep:
    permissions:
      contents: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/semgrep.yml@a311edecaf72edbbbada28c2c3dd41a2af4145e3 # v2
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/trivy.yml@a311edecaf72edbbbada28c2c3dd41a2af4145e3 # v2
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: LeilaoMi/security-workflows/.github/workflows/zizmor.yml@a311edecaf72edbbbada28c2c3dd41a2af4145e3 # v2
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: LeilaoMi/security-workflows/.github/workflows/dependency-review.yml@a311edecaf72edbbbada28c2c3dd41a2af4145e3 # v2

name: Security
# Shared scans from LeilaoMi/security-workflows (pinned to a commit SHA;
# Dependabot's github-actions updates bump it). Job-level permissions
# cap what each reusable workflow may use.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/gitleaks.yml@6e73d69a8a3aa4ff715388f5f8c53add8f1c57b8 # v4
  semgrep:
    permissions:
      contents: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/semgrep.yml@6e73d69a8a3aa4ff715388f5f8c53add8f1c57b8 # v4
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: LeilaoMi/security-workflows/.github/workflows/trivy.yml@6e73d69a8a3aa4ff715388f5f8c53add8f1c57b8 # v4
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: LeilaoMi/security-workflows/.github/workflows/zizmor.yml@6e73d69a8a3aa4ff715388f5f8c53add8f1c57b8 # v4
  dependency-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: LeilaoMi/security-workflows/.github/workflows/dependency-review.yml@6e73d69a8a3aa4ff715388f5f8c53add8f1c57b8 # v4
  lint:
    uses: LeilaoMi/security-workflows/.github/workflows/lint.yml@6e73d69a8a3aa4ff715388f5f8c53add8f1c57b8 # v4
    with:
      ruff: true
      basedpyright: true
